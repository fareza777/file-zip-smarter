[package]
name = "hatch_core"
version = "1.0.0"
edition = "2021"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
description = "Hatch archive engine: safe, space-aware extraction for Android"

[lib]
name = "hatch_core"
crate-type = ["cdylib", "rlib"]

[dependencies]
zip = { version = "9.1.3", default-features = false, features = [
    "aes-crypto",
    "deflate-flate2",
    "deflate64",
    "time",
] }
tar = "0.4.46"
flate2 = { version = "1.1", default-features = false, features = ["rust_backend"] }
lzma-rust2 = { version = "0.23.0", default-features = false, features = ["std", "xz"] }
ruzstd = "0.9.1"
bzip2-rs = "0.1.2"
sevenz-rust2 = { version = "0.24.1", default-features = false, features = ["aes256"] }
unrar = "0.5.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
crc32fast = "1"
libc = "0.2"

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21.1"

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "unwind"

[profile.dev]
opt-level = 1

[patch.crates-io]
unrar_sys = { path = "vendor/unrar_sys" }
